name: home_nursing_emr
description: Enterprise Home Nursing EMR, CRM, and Scheduling system with Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^4.15.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  firebase_storage: ^11.6.0
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pdf: ^3.10.7
  qr_flutter: ^4.1.0
  http: ^1.2.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  google_maps_flutter: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/logo.png